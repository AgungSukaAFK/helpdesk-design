<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — DesignDesk</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #fff; color: #090b0a; text-align: center; padding: 16px; box-sizing: border-box; }
  img { width: 96px; height: 96px; border-radius: 20px; }
  button { margin-top: 16px; padding: 10px 20px; border: 0; border-radius: 8px; background: #090b0a; color: #fff; font-size: 15px; }
  @media (prefers-color-scheme: dark) { body { background: #090b0a; color: #f5f5f5; } button { background: #f5f5f5; color: #090b0a; } }
</style>
</head>
<body>
  <div>
    <img src="/icons/icon-192.png" alt="">
    <h1>Tidak ada koneksi</h1>
    <p>Periksa internet kamu, lalu coba lagi.</p>
    <button onclick="location.reload()">Coba lagi</button>
  </div>
</body>
</html>
